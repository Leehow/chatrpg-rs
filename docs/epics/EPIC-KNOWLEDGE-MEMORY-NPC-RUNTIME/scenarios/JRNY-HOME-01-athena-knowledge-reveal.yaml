id: JRNY-HOME-01-athena-knowledge-reveal
version: 1
acceptance_ids:
  - DA-KNOW-02
  - DA-KNOW-04
  - DA-KNOW-05
  - DA-SPOIL-01
  - DA-SPOIL-02
  - DA-SPOIL-04
  - DA-PIPE-01
  - DA-PIPE-02
ruleset_id: cyberpunk_red
module_id: cyberpunk_red.homecoming

setup:
  database: isolated
  assets: current_verified_bundle
  character:
    create_via: cli
    preferences: "技术型角色，擅长观察、电子、维修；与本地修理圈有联系"
    auto_complete: true
    require_persisted: true
    require_session_binding: true
  session:
    start_via: created_character_session
    require_playable_scene: true

player:
  mode: adaptive_script
  persona: "谨慎、会先观察再动手，不知道模组幕后信息"
  knowledge_source: player_view_only
  max_trigger_attempts: 2

chapters:
  - id: first_observation
    when: session_ready
    action: "我先站在安全距离观察现场，看看无人机、警察和仓库门口分别是什么情况。"
    trigger:
      reachability: [turn_completed]
      mechanism: [context_or_entity_surfaced]
      forbid_mechanism: [hidden_fact_granted]
    assert:
      player_text_forbids: [configured_hidden_fact_terms]
      state: [player_hidden_fact_unknown]

  - id: technical_action
    when: first_observation_passed
    actions:
      - "我检查无人机背后的线缆，看它接到哪里，有没有明显危险。"
      - if_not_triggered: "我实际拆开护盖，判断能不能安全切断，并开始操作。"
    trigger:
      reachability: [technical_action_routed]
      mechanism_one_of: [awaiting_player_roll, gm_roll_started]
      require_dice: true
      require_check_resolution: true

  - id: outcome
    when: check_resolved
    branch:
      success:
        assert:
          state: [player_learned_relevant_fact]
          player_text_requires_semantic: [observable_discovery]
      failure:
        assert:
          state: [hidden_fact_still_unknown]
        next_action: "我先停手，不冒险硬拆，去找更懂这套设备的人问问。"

  - id: continuity
    when: player_learned_relevant_fact
    restart_process: true
    action: "根据我刚才实际查到的东西，我现在能确定这台无人机的什么情况？"
    assert:
      state: [knowledge_survives_reload]
      player_text_requires_semantic: [revealed_fact_summary]

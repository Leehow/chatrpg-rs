version: 1
run_policy: continuous_until_terminal

wip:
  writer_wip_min: 4
  writer_wip_max: 6
  verification_wip_min: 1
  verification_wip_max: 2
  integration_wip: 1

# Work-conserving, event-driven scheduler caps consumed by scripts/team-lead/tlm.
# `wip:` above is retained for backward compatibility; `scheduler:` is authoritative
# for the runner. min = WIP floor (refill target), max = lane ceiling.
scheduler:
  implementation:
    min: 6
    max: 8
  review:
    min: 2
    max: 3
  journey_validation:
    min: 1
    max: 2
  integration:
    max: 1
  planning:
    min_ready_buffer: 12
    target_ready_buffer: 16
  # Backpressure trips when a backlog/starvation count reaches the threshold.
  # review_backlog throttles new implementation dispatch and asks for more review;
  # integration_backlog warns the serial integration train is falling behind;
  # ready_starvation flags the planner to produce more conflict-free ready work.
  backpressure:
    review_backlog: 6
    integration_backlog: 4
    ready_starvation: 4

git:
  worktree_required_for_code: true
  commit_policy: scoped_commit
  create_local_branches: true
  create_local_worktrees: true
  trial_cherry_pick: true
  integration_fast_forward: true
  push: false
  merge_main: false
  deploy: false
  history_rewrite: false

integration:
  branch_pattern: "codex/{work_id}-integration"
  worktree_pattern: ".worktrees/{work_id}/integration"
  rolling: true
  human_dirty_worktree_is_blocker: false

worker:
  default_backend: cc-print
  code_model_tier: opus
  verification_model_tier: sonnet
  continuation_policy: repair_until_acceptance_or_human_blocker

hotspots:
  - workspace-cargo
  - crate-facades
  - migrations
  - plugin-registry
  - generated-contracts
  - acceptance-ledger
  - workgraph

environment_isolation:
  cargo_target_dir: ".target/team-lead/{task_id}"
  log_dir: ".tmp/team-lead/logs/{task_id}"
  cassette_dir: ".tmp/team-lead/cassettes/{task_id}"
  database_suffix: "{work_id}_{task_id}"

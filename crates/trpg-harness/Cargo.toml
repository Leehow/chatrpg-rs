[package]
name = "trpg-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "trpg_harness"
path = "src/lib.rs"

[[bin]]
name = "trpg-harness"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
# Reuse the production knowledge-leak verifier (`scan_player_visible_leak`,
# `FactSurfaceMarker`) so the harness's deterministic post-output spoiler check is
# the SAME mechanism the GM's NoSpoiler plugin uses, not a parallel reimplementation.
trpg-model = { path = "../trpg-model" }

[dev-dependencies]
trpg-runtime = { path = "../trpg-runtime" }
